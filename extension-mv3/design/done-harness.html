<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Done harness · Screenbreak</title>
	<!-- Dev only, never shipped: the print page's markup (copied from static/print.html, plus the done slot that
	     B1 adds per contract C-4) with the real stylesheets, so design/done-harness.mjs can drive every done state. -->
	<link rel="stylesheet" href="ui.css">
	<link rel="stylesheet" href="flow.css">
	<link rel="stylesheet" href="done.css">
	<script>
		// A tiny stand-in for the extension APIs the done state reads.
		const area = () => { let data = {}; return {
			async get(key) { const keys = key == null ? Object.keys(data) : [].concat(key); return Object.fromEntries(keys.filter(k => k in data).map(k => [k, structuredClone(data[k])])); },
			async set(items) { data = { ...data, ...structuredClone(items) }; },
			async clear() { data = {}; }
		}; };
		window.chrome = { runtime: { id: "harnessextensionid" }, storage: { local: area(), session: area() } };
	</script>
</head>
<body>
	<section class="desk" aria-label="Print preview">
		<div class="desk-bar">
			<p class="source"><img class="favicon" alt="" width="16" height="16" hidden><strong class="source-title"></strong><span class="source-site"></span></p>
			<div class="segmented view-toggle" role="radiogroup" aria-label="View">
				<label><input type="radio" name="view" value="pages" checked><span>Pages</span></label>
				<label><input type="radio" name="view" value="spread"><span>Side by side</span></label>
			</div>
		</div>
		<div class="sheets"></div>
		<div class="wait" aria-live="polite">
			<div class="wait-inner">
				<div class="web" aria-hidden="true">
					<span class="blk nav"></span><span class="blk title"></span><span class="blk title2"></span><span class="blk photo"></span>
					<span class="blk ad"></span><span class="blk share"></span><span class="blk lines"></span><span class="blk cookie"></span><span class="blk ad2"></span>
				</div>
				<ol class="steps"></ol>
			</div>
		</div>
		<section class="message" hidden aria-live="polite">
			<h1 class="message-title"></h1>
			<p class="message-text"></p>
			<p class="message-actions">
				<a class="button message-primary" target="_self" hidden></a>
				<button type="button" class="link-button close-tab">Close this tab</button>
			</p>
		</section>
	</section>

	<aside class="panel" aria-label="Print settings">
		<div class="panel-head">
			<img src="icons/logo.svg" alt="Screenbreak" class="wordmark" width="180" height="20">
			<div class="who"></div>
		</div>
		<div class="panel-body">
			<div class="intro">
				<h1>Ready to print</h1>
				<p class="summary"></p>
			</div>
			<p class="straight-note" hidden>The button prints straight away. <button type="button" class="link-button show-page-next">Show this page next time</button></p>

			<section class="sec" aria-labelledby="design-heading">
				<div class="sec-h"><h2 id="design-heading">Design</h2><span class="help">Picked for this article</span></div>
				<div class="picks" role="radiogroup" aria-labelledby="design-heading"></div>
				<button type="button" class="link-button all-toggle" aria-expanded="false">See all designs</button>
				<div class="design-grid" role="radiogroup" aria-label="All designs" hidden></div>
			</section>

			<section class="sec" aria-labelledby="paper-heading">
				<div class="sec-h"><h2 id="paper-heading">Paper and ink</h2></div>
				<div class="opt">
					<p class="lbl" id="paper-label">Paper</p>
					<div class="segmented wide" role="radiogroup" aria-labelledby="paper-label" data-name="paper"></div>
				</div>
				<div class="opt">
					<p class="lbl" id="pictures-label">Pictures</p>
					<div class="segmented wide" role="radiogroup" aria-labelledby="pictures-label" data-name="pictures"></div>
					<p class="help pictures-help"></p>
				</div>
				<div class="opt references-opt" hidden>
					<p class="lbl" id="references-label">Reference list</p>
					<div class="segmented wide" role="radiogroup" aria-labelledby="references-label" data-name="references"></div>
					<p class="help references-help"></p>
				</div>
				<div class="opt-row">
					<label class="switch duplex"><input type="checkbox" name="duplex" role="switch"><span class="track"></span>Print on both sides</label>
				</div>
			</section>

			<div class="actions">
				<button type="button" class="button print-button" disabled>
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3.5h10V8"/><rect x="3.5" y="8" width="17" height="8.5" rx="1.5"/><path d="M7 13.5h10v7H7z"/></svg>
					<span class="print-label">Print</span>
				</button>
				<div class="secondary-row">
					<button type="button" class="link-button pdf-button" disabled>Save as PDF</button>
					<span class="help sheet-count"></span>
				</div>
				<p class="help duplex-hint" hidden>Turn on Two-sided under More settings in the print dialog.</p>
				<div class="quota"></div>
				<span class="save-status" role="status" aria-live="polite" hidden><span class="save-icon" aria-hidden="true"></span><span class="save-text"></span><span class="save-actions"></span></span>
			</div>

			<div class="remember">
				<label class="remember-top"><input type="checkbox" name="remember"><span><strong>Remember these choices</strong><small>Use them for the next article too.</small></span></label>
				<div class="remember-more" hidden>
					<fieldset>
						<legend>Design</legend>
						<label class="radio"><input type="radio" name="rememberDesign" value="fixed"><span><span class="fixed-name"></span> for every article</span></label>
						<label class="radio"><input type="radio" name="rememberDesign" value="best"><span>The best match for each article</span></label>
					</fieldset>
					<fieldset>
						<legend>When I press the button</legend>
						<label class="radio"><input type="radio" name="rememberMode" value="page"><span>Show me this page first</span></label>
						<label class="radio"><input type="radio" name="rememberMode" value="straight"><span>Print straight away<small>Right-click the button any time to come back here.</small></span></label>
					</fieldset>
				</div>
			</div>

			<div class="account"></div>
			<div class="done" hidden></div>
		</div>
	</aside>

		<script src="harness.js"></script>
</body>
</html>
