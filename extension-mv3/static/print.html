<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Print · Screenbreak</title>
	<link rel="stylesheet" href="ui.css">
	<link rel="stylesheet" href="print.css">
</head>
<body class="font-sans size-normal columns-1 is-loading">
	<header class="toolbar">
		<img src="icons/logo.png" alt="Screenbreak" class="wordmark" width="141" height="20">
		<img src="icons/icon_48.png" alt="Screenbreak" class="mark" width="24" height="24">
		<button type="button" class="options-toggle" aria-expanded="false" aria-controls="print-options" title="Print options">
			<span class="sample-serif" aria-hidden="true">Aa</span><span class="visually-hidden">Print options</span>
		</button>
		<form class="options" id="print-options" aria-label="Print options">
			<div class="segmented" role="radiogroup" aria-label="Font" title="Font">
				<label><input type="radio" name="font" value="sans"><span class="sample-sans">Sans</span></label>
				<label><input type="radio" name="font" value="serif"><span class="sample-serif">Serif</span></label>
			</div>
			<div class="segmented" role="radiogroup" aria-label="Text size" title="Text size">
				<label title="Small text"><input type="radio" name="size" value="small" aria-label="Small"><span class="size-a" style="font-size:12px">A</span></label>
				<label title="Medium text"><input type="radio" name="size" value="normal" aria-label="Medium"><span class="size-a" style="font-size:15px">A</span></label>
				<label title="Large text"><input type="radio" name="size" value="large" aria-label="Large"><span class="size-a" style="font-size:18px">A</span></label>
			</div>
			<div class="segmented icons" role="radiogroup" aria-label="Columns" title="Columns">
				<label title="One column"><input type="radio" name="columns" value="1" aria-label="One column"><span><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M5.5 5h5M5.5 7.5h5M5.5 10h5"/></svg></span></label>
				<label title="Two columns"><input type="radio" name="columns" value="2" aria-label="Two columns"><span><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M4.5 5h2.5M4.5 7.5h2.5M4.5 10h2.5M9 5h2.5M9 7.5h2.5M9 10h2.5"/></svg></span></label>
			</div>
			<label class="switch"><input type="checkbox" name="images" role="switch"><span class="track"></span>Images</label>
		</form>
		<div class="toolbar-end">
			<span class="print-status" aria-live="polite"></span>
			<span class="keys print-keys" aria-hidden="true"></span>
			<button type="button" class="button print-button" title="Opens the print dialog. Choose Save as PDF there for a PDF.">
				<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3.5h10V8"/><rect x="3.5" y="8" width="17" height="8.5" rx="1.5"/><path d="M7 13.5h10v7H7z"/></svg>
				<span class="print-label">Print</span>
			</button>
		</div>
	</header>
	<main class="desk">
		<div class="sheet skeleton" aria-hidden="true">
			<span class="bone meta"></span><span class="bone title"></span><span class="bone title short"></span>
			<span class="bone line"></span><span class="bone hero"></span>
			<span class="bone line"></span><span class="bone line"></span><span class="bone line"></span><span class="bone line short"></span>
		</div>
		<article class="sheet article" hidden>
			<header>
				<p class="meta"><span class="site"></span><span class="byline"></span><span class="date"></span></p>
				<h1 class="title"></h1>
				<p class="excerpt"></p>
				<hr>
				<figure class="hero" hidden><img alt=""></figure>
			</header>
			<section class="content"></section>
			<footer>
				<hr>
				<p>Printed with Screenbreak from <a class="source"></a></p>
			</footer>
		</article>
		<section class="sheet message" hidden aria-live="polite">
			<h1 class="message-title"></h1>
			<p class="message-text"></p>
			<p class="message-actions">
				<a class="button message-primary" target="_self" hidden></a>
				<button type="button" class="link-button close-tab">Close this tab</button>
			</p>
		</section>
	</main>
	<script src="print.js"></script>
</body>
</html>
